<text xml:space="preserve" text-anchor="start" x="43.65" y="-291.4" font-family="Roboto, sans-serif" font-size="14.00">Hat der Berechtigte in der Qualitätsrückmeldung mitgeteilt, dass er die Stammdaten ohne Anmerkung übernommen hat?</text>
