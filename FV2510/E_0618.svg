<text xml:space="preserve" text-anchor="start" x="14.4" y="-263.4" font-family="Roboto, sans-serif" font-size="14.00">Dies ist für jeden in der Rückmeldung vorhandenen Verwendungszeitraum jeweils</text>
<text xml:space="preserve" text-anchor="start" x="14.4" y="-249.4" font-family="Roboto, sans-serif" font-size="14.00">für den gesamten Zeitraum zu prüfen.</text>
